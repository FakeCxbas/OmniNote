<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2335"/>
      <stop offset="100%" stop-color="#13141c"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24283b"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>

    <!-- Curve Stroke Gradient -->
    <linearGradient id="strokeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7dcfff"/>
    </linearGradient>

    <!-- Pen Body Gradient -->
    <linearGradient id="penBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0af68"/>
      <stop offset="100%" stop-color="#ff9e64"/>
    </linearGradient>

    <!-- Stylus Tip Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Squircle Base App Frame -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" stroke="#3b4261" stroke-width="4" filter="url(#dropShadow)"/>

  <!-- Inner Notebook Canvas Card -->
  <rect x="64" y="64" width="384" height="384" rx="44" ry="44" fill="url(#cardGrad)" stroke="#2f354f" stroke-width="2"/>

  <!-- STEM Mathematical Grid Matrix -->
  <g stroke="#282e44" stroke-width="1.8" stroke-dasharray="4,4">
    <!-- Vertical Grid Lines -->
    <line x1="128" y1="96" x2="128" y2="416"/>
    <line x1="192" y1="96" x2="192" y2="416"/>
    <line x1="256" y1="96" x2="256" y2="416"/>
    <line x1="320" y1="96" x2="320" y2="416"/>
    <line x1="384" y1="96" x2="384" y2="416"/>

    <!-- Horizontal Grid Lines -->
    <line x1="96" y1="128" x2="416" y2="128"/>
    <line x1="96" y1="192" x2="416" y2="192"/>
    <line x1="96" y1="256" x2="416" y2="256"/>
    <line x1="96" y1="320" x2="416" y2="320"/>
    <line x1="96" y1="384" x2="416" y2="384"/>
  </g>

  <!-- STEM Cartesian Coordinate Axes -->
  <g stroke="#414868" stroke-width="3">
    <!-- X-Axis -->
    <line x1="96" y1="320" x2="416" y2="320"/>
    <polyline points="408,314 416,320 408,326" fill="none" stroke="#7aa2f7" stroke-width="3"/>

    <!-- Y-Axis -->
    <line x1="160" y1="416" x2="160" y2="96"/>
    <polyline points="154,104 160,96 166,104" fill="none" stroke="#7aa2f7" stroke-width="3"/>
  </g>

  <!-- Mathematical Integral / Wave Curve (\int f(x) dx) -->
  <path d="M 112,336 C 144,320 160,208 208,208 C 256,208 272,352 320,352 C 368,352 384,240 408,224"
        fill="none" stroke="#7aa2f7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#glow)"/>
  <path d="M 112,336 C 144,320 160,208 208,208 C 256,208 272,352 320,352 C 368,352 384,240 408,224"
        fill="none" stroke="url(#strokeGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- High-Precision Digital Stylus Pen -->
  <g transform="translate(48, -16) rotate(42, 290, 210)">
    <!-- Stylus Shadow -->
    <rect x="274" y="90" width="32" height="200" rx="16" ry="16" fill="#000000" opacity="0.35" transform="translate(10, 10)"/>

    <!-- Stylus Upper Body -->
    <rect x="274" y="80" width="32" height="150" rx="12" ry="12" fill="#24283b" stroke="#414868" stroke-width="2"/>
    <!-- Stylus Grip Section -->
    <rect x="274" y="200" width="32" height="60" rx="4" ry="4" fill="#1f2335" stroke="#7aa2f7" stroke-width="2"/>

    <!-- Stylus Dual Rocker Buttons -->
    <rect x="286" y="210" width="8" height="16" rx="4" ry="4" fill="#7aa2f7"/>
    <rect x="286" y="232" width="8" height="16" rx="4" ry="4" fill="#bb9af7"/>

    <!-- Stylus Conical Tip Cone -->
    <polygon points="274,260 306,260 293,294 287,294" fill="#3b4261" stroke="#414868" stroke-width="1"/>

    <!-- Active High-Precision Nib -->
    <polygon points="287,294 293,294 291,304 289,304" fill="#ffffff"/>

    <!-- Stylus Glow Contact Point -->
    <circle cx="290" cy="305" r="4.5" fill="#7dcfff" filter="url(#glow)"/>
    <circle cx="290" cy="305" r="2" fill="#ffffff"/>
  </g>
</svg>
